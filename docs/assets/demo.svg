<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-label="AutomationMarketplace demo: verified Home Assistant smart home automations with safety audit, simulation, and rollback.">
  <metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description dc:creator="MRJonam91" dc:identifier="amp.p5.8e3a12" dc:rights="(c) 2026 Manoj Rollo (MRJonam91)"/></rdf:RDF></metadata>
  <style>
    .l { font: 14px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; white-space: pre; opacity: 0; animation: in 7s infinite; }
    @keyframes in { 0% { opacity: 0; } 4% { opacity: 1; } 92% { opacity: 1; } 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .l { animation: none; opacity: 1; } }
  </style>
  <rect width="760" height="330" rx="12" fill="#0d1117"/>
  <rect width="760" height="36" rx="12" fill="#161b22"/>
  <rect y="24" width="760" height="12" fill="#161b22"/>
  <circle cx="22" cy="18" r="6" fill="#ff5f57"/><circle cx="42" cy="18" r="6" fill="#febc2e"/><circle cx="62" cy="18" r="6" fill="#28c840"/>
  <text x="380" y="23" fill="#8b949e" text-anchor="middle" style="font: 13px ui-monospace, monospace">automation-marketplace — verified smart home catalog &amp; safety guard</text>
  
  <text x="24" y="66" fill="#e6edf3" class="l" style="animation-delay:0.3s"><tspan fill="#58a6ff">$ </tspan>automation-marketplace list --category climate</text>
  <text x="24" y="92" fill="#3fb950" class="l" style="animation-delay:0.8s">• thermostat-window-saver — Smart Thermostat Window Saver [Grade C Review Advised]</text>
  
  <text x="24" y="128" fill="#e6edf3" class="l" style="animation-delay:1.5s"><tspan fill="#58a6ff">$ </tspan>automation-marketplace show thermostat-window-saver</text>
  <text x="24" y="154" fill="#d29922" class="l" style="animation-delay:2.0s">⚠️ Hazards: compressor_cycle (mitigated: 120s debounce), freeze_hazard (mitigated: 12°C)</text>
  
  <text x="24" y="190" fill="#e6edf3" class="l" style="animation-delay:2.7s"><tspan fill="#58a6ff">$ </tspan>automation-marketplace simulate thermostat-window-saver</text>
  <text x="24" y="216" fill="#3fb950" class="l" style="animation-delay:3.2s">✔ Simulation status: PASSED | climate.set_hvac_mode called | State verified</text>

  <text x="24" y="252" fill="#e6edf3" class="l" style="animation-delay:3.9s"><tspan fill="#58a6ff">$ </tspan>automation-marketplace export thermostat-window-saver</text>
  <text x="24" y="278" fill="#3fb950" class="l" style="animation-delay:4.4s">✓ Exported Home Assistant YAML with embedded rollback procedure</text>
  <text x="24" y="304" fill="#8b949e" class="l" style="animation-delay:4.9s">♥ Sostieni / Support: github.com/sponsors/MRJonam91 · ko-fi.com/mrjonam</text>
